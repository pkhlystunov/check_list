<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Инспекция по Охране Труда и ПБ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>📋 Контроль Охраны Труда и ПБ</h2>
    
    <!-- ШАГ 1: Авторизация инспектора, выбор Объекта и Подрядчика -->
    <div id="step-1-form" class="card primary-border">
        <div class="loading-overlay" id="setup-loading">Загрузка справочников из Google Таблиц...</div>
        
        <div id="form-fields-wrapper" style="display:none;">
            <label for="inspector"><b>ФИО Проверяющего сотрудника:</b></label>
            <input type="text" id="inspector" placeholder="Например, Хлыстунов П.А.">
            
            <label for="object-select"><b>Объект строительства (Лист 1_Объекты):</b></label>
            <select id="object-select">
                <option value="">-- Выберите объект из списка --</option>
            </select>
            
            <label for="contractor-select"><b>Подрядная организация (Лист 2_Подрядчики):</b></label>
            <select id="contractor-select">
                <option value="">-- Выберите подрядчика --</option>
            </select>
            
            <button onclick="goToStep2()" class="btn btn-primary" style="margin-top: 15px; width: 100%;">Далее к выбору чек-листа →</button>
        </div>
    </div>

    <!-- ШАГ 2: Выбор конкретного списка вопросов (3_Чек_лист) -->
    <div id="step-2-form" class="card primary-border" style="display:none;">
        <h3>Выбор раздела чек-листа</h3>
        <p class="meta-info">Объект: <span id="meta-obj"></span> | Подрядчик: <span id="meta-contr"></span></p>
        
        <label for="category-select"><b>Выберите направление проверки (Лист 3_Чек_лист):</b></label>
        <select id="category-select">
            <option value="">-- Загрузить все вопросы --</option>
        </select>
        
        <div style="margin-top: 25px; display: flex; gap: 10px;">
            <button onclick="backToStep1()" class="btn btn-secondary">← Назад</button>
            <button onclick="startAudit()" class="btn btn-primary" style="flex: 1;">Начать аудит 🚀</button>
        </div>
    </div>

    <!-- ШАГ 3: Экран прохождения чек-листа -->
    <div id="step-3-checklist" style="display:none;">
        <div class="audit-header card">
            <p>👤 <b>Инспектор:</b> <span id="audit-meta-insp"></span></p>
            <p>🏗️ <b>Объект:</b> <span id="audit-meta-obj"></span></p>
            <p>🚜 <b>Подрядчик:</b> <span id="audit-meta-contr"></span></p>
            <p>📂 <b>Раздел:</b> <span id="audit-meta-cat"></span></p>
        </div>
        
        <!-- Сюда JS сгенерирует карточки с вопросами -->
        <div id="questions-container"></div>
        
        <div style="margin-top: 25px; display: flex; gap: 10px;">
            <button onclick="backToStep2()" class="btn btn-secondary">Изменить раздел</button>
            <button onclick="submitAudit()" id="submit-btn" class="btn btn-primary" style="background: #27ae60; flex: 1;">Сохранить аудит в Google Таблицу</button>
        </div>
    </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
